name: Security Pipeline

on:
  push:
    branches:
      - refactor/invoice-service

jobs:

  # 🔍 SONAR JOB
  sonar:
    runs-on: ubuntu-latest
    outputs:
      sonar_status: ${{ steps.sonar-gate.outputs.quality-gate-status }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      - name: SonarQube Quality Gate
        id: sonar-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # 🔐 SNYK JOB (ONLY IF SONAR PASSED)
  snyk:
    runs-on: ubuntu-latest
    needs: sonar
    if: needs.sonar.outputs.sonar_status == 'PASSED'

    outputs:
      snyk_status: ${{ steps.set-status.outputs.snyk_status }}

    steps:
      - uses: actions/checkout@v4

      # 👇 same pattern like your example (CLI, no snyk action)
      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Test
        id: snyk-test
        continue-on-error: true
        run: snyk test --severity-threshold=high

      - name: Set Snyk Status
        id: set-status
        run: |
          if [ "${{ steps.snyk-test.outcome }}" = "failure" ]; then
            echo "snyk_status=FAILED" >> $GITHUB_OUTPUT
          else
            echo "snyk_status=PASSED" >> $GITHUB_OUTPUT
          fi


  # 📧 NOTIFICATION JOB (COMMON)
  notify:
    runs-on: ubuntu-latest
    needs: [sonar, snyk]
    if: always()

    steps:
      - name: Decide Failure Reason
        id: reason
        run: |
          if [ "${{ needs.sonar.outputs.sonar_status }}" = "FAILED" ]; then
            echo "reason=SonarQube Quality Gate Failed" >> $GITHUB_OUTPUT
          elif [ "${{ needs.snyk.outputs.snyk_status }}" = "FAILED" ]; then
            echo "reason=Snyk Vulnerabilities Detected" >> $GITHUB_OUTPUT
          else
            echo "reason=SUCCESS" >> $GITHUB_OUTPUT
          fi

      - name: Send Email (ONLY IF FAIL)
        if: steps.reason.outputs.reason != 'SUCCESS'
        uses: hilarion5/send-mail@v1
        with:
          smtp-server: smtp.gmail.com
          smtp-port: 587
          smtp-secure: false
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from-email: ${{ secrets.EMAIL_USERNAME }}
          to-email: asadchamp109@gmail.com,kajapathy07@gmail.com
          subject: "ALERT: Security Pipeline Failed"
          html: |
            <h2 style="color:red;">Security Pipeline Failed</h2>

            <p><b>Reason:</b> ${{ steps.reason.outputs.reason }}</p>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Author:</b> ${{ github.actor }}</p>

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              View Pipeline
            </a>
