name: Security Pipeline

on:
  push:
    branches:
      - master

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔍 SONARQUBE SCAN
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ✅ QUALITY GATE CHECK
      - name: SonarQube Quality Gate
        id: sonar-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 📧 EMAIL IF SONAR FAILS
      - name: Email if Sonar Fails
        if: steps.sonar-gate.outputs.quality-gate-status == 'FAILED'
        uses: hilarion5/send-mail@v1
        with:
          smtp-server: smtp.gmail.com
          smtp-port: 587
          smtp-secure: false
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from-email: ${{ secrets.EMAIL_USERNAME }}
          to-email: lijazsalim@gmail.com,asadchamp109@gmail.com,kajapathy07@gmail.com
          subject: "FAILURE: SonarQube Quality Gate Failed"
          html: |
            <h2 style="color:red;">SonarQube Failed</h2>
            <p>Quality Gate failed. Fix code issues before proceeding.</p>

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              View Report
            </a>

      # ⛔ STOP PIPELINE IF SONAR FAILS
      - name: Stop if Sonar Failed
        if: steps.sonar-gate.outputs.quality-gate-status == 'FAILED'
        run: exit 1

      # 🔐 SNYK SCAN (ONLY RUNS IF SONAR PASSED)
      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Test
        id: snyk-test
        continue-on-error: true
        run: |
          snyk test --severity-threshold=high

      # 📧 EMAIL IF SNYK FAILS
      - name: Email if Snyk Fails
        if: steps.snyk-test.outcome == 'failure'
        uses: hilarion5/send-mail@v1
        with:
          smtp-server: smtp.gmail.com
          smtp-port: 587
          smtp-secure: false
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from-email: ${{ secrets.EMAIL_USERNAME }}
          to-email: lijazsalim@gmail.com,asadchamp109@gmail.com,kajapathy07@gmail.com
          subject: "FAILURE: Snyk Vulnerabilities Detected"
          html: |
            <h2 style="color:red;">Snyk Scan Failed</h2>
            <p>Vulnerabilities detected in dependencies.</p>

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              View Report
            </a>

      # 📧 EMAIL IF EVERYTHING PASSES
      - name: Email if All Passed
        if: steps.snyk-test.outcome == 'success'
        uses: hilarion5/send-mail@v1
        with:
          smtp-server: smtp.gmail.com
          smtp-port: 587
          smtp-secure: false
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from-email: ${{ secrets.EMAIL_USERNAME }}
          to-email: lijazsalim@gmail.com,asadchamp109@gmail.com,kajapathy07@gmail.com
          subject: "SUCCESS: All Security Checks Passed"
          html: |
            <h2 style="color:green;">Pipeline Successful</h2>
            <p>SonarQube and Snyk scans passed successfully.</p>

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              View Pipeline
            </a>
